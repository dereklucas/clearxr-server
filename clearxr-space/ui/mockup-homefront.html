<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024">
<title>HOMEFRONT — VR Game Launcher</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1024px;
    height: 640px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #e8e8ec;
    background: rgba(8, 8, 15, 0.85);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Hero Section (top 55%) ── */
  .hero {
    position: relative;
    width: 100%;
    height: 352px; /* 55% of 640 */
    overflow: hidden;
    cursor: default;
  }

  .hero-art {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: opacity 0.3s ease, background-image 0.3s ease;
  }

  /* vignette overlay — darkens bottom for text legibility */
  .hero-art::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(8, 8, 15, 0.05) 0%,
      rgba(8, 8, 15, 0.25) 40%,
      rgba(8, 8, 15, 0.82) 85%,
      rgba(8, 8, 15, 0.95) 100%
    );
  }

  .hero-content {
    position: absolute;
    bottom: 28px;
    left: 40px;
    right: 40px;
    z-index: 2;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }

  .hero-info {
    flex: 1;
    min-width: 0;
  }

  .hero-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #4de8e0;
    margin-bottom: 6px;
    opacity: 0.9;
  }

  .hero-title {
    font-size: 32px;
    font-weight: 700;
    line-height: 1.1;
    color: #ffffff;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity 0.3s ease;
  }

  .hero-desc {
    font-size: 14px;
    font-weight: 400;
    color: rgba(232, 232, 236, 0.7);
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 560px;
  }

  .btn-launch {
    flex-shrink: 0;
    height: 52px;
    min-width: 160px;
    padding: 0 36px;
    border: none;
    border-radius: 26px;
    background: linear-gradient(135deg, #4de8e0 0%, #3bbfff 100%);
    color: #0a0a14;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    box-shadow: 0 4px 20px rgba(77, 232, 224, 0.25);
  }

  .btn-launch:hover {
    transform: scale(1.04);
    box-shadow: 0 6px 28px rgba(77, 232, 224, 0.4);
    filter: brightness(1.08);
  }

  .btn-launch:active {
    transform: scale(0.97);
  }

  /* ── Bottom Rows Section (bottom 45%) ── */
  .rows-section {
    position: relative;
    width: 100%;
    height: 288px; /* 45% of 640 */
    background: rgba(12, 12, 22, 0.55);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    padding: 14px 0 0 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: hidden;
  }

  .row {
    flex-shrink: 0;
  }

  .row-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(232, 232, 236, 0.4);
    padding-left: 40px;
    margin-bottom: 8px;
  }

  .row-scroll {
    position: relative;
    padding-left: 40px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
    /* fade masks on left/right */
    mask-image: linear-gradient(
      to right,
      transparent 0px,
      black 40px,
      black calc(100% - 40px),
      transparent 100%
    );
    -webkit-mask-image: linear-gradient(
      to right,
      transparent 0px,
      black 40px,
      black calc(100% - 40px),
      transparent 100%
    );
  }

  .row-scroll::-webkit-scrollbar { display: none; }

  .row-track {
    display: flex;
    gap: 12px;
    padding-right: 48px;
  }

  /* ── Game Card ── */
  .card {
    flex-shrink: 0;
    width: 148px;
    cursor: pointer;
    transition: transform 0.2s ease, filter 0.2s ease;
  }

  .card:hover {
    transform: translateY(-4px) scale(1.04);
    filter: brightness(1.15);
  }

  .card:hover .card-title {
    color: #ffffff;
  }

  .card.active-card {
    outline: 2px solid rgba(77, 232, 224, 0.6);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .card-img {
    width: 148px;
    height: 69px; /* header.jpg aspect ≈ 460:215 */
    border-radius: 5px;
    background-size: cover;
    background-position: center;
    background-color: rgba(255, 255, 255, 0.05);
  }

  .card-title {
    margin-top: 5px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(232, 232, 236, 0.55);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.2s ease;
    line-height: 1.2;
  }

  /* ── Transition helper ── */
  .fade-swap {
    animation: fadeIn 0.3s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0.4; }
    to   { opacity: 1; }
  }
</style>
</head>
<body>

<!-- ════ HERO ════ -->
<section class="hero" id="hero">
  <div class="hero-art" id="heroArt"></div>
  <div class="hero-content">
    <div class="hero-info">
      <div class="hero-label" id="heroLabel">Continue Playing</div>
      <div class="hero-title" id="heroTitle"></div>
      <div class="hero-desc" id="heroDesc"></div>
    </div>
    <button class="btn-launch" id="btnLaunch">Launch</button>
  </div>
</section>

<!-- ════ ROWS ════ -->
<section class="rows-section">
  <!-- Recent -->
  <div class="row">
    <div class="row-label">Recent</div>
    <div class="row-scroll">
      <div class="row-track" id="recentRow"></div>
    </div>
  </div>
  <!-- Library -->
  <div class="row">
    <div class="row-label">Library</div>
    <div class="row-scroll">
      <div class="row-track" id="libraryRow"></div>
    </div>
  </div>
</section>

<script>
  // ── Game data ──
  const GAMES = [
    { appid: 546560, title: 'Half-Life: Alyx',       desc: 'Return to City 17 in VR. Unravel the mystery of the Combine\'s invasion.' },
    { appid: 620980, title: 'Beat Saber',            desc: 'Slash the beats in an immersive VR rhythm experience.' },
    { appid: 823500, title: 'BONEWORKS',             desc: 'Physics-driven VR action with experimental mechanics.' },
    { appid: 555160, title: 'Blade & Sorcery',       desc: 'Medieval fantasy sandbox with full physics melee combat.' },
    { appid: 617830, title: 'SUPERHOT VR',           desc: 'Time moves only when you move. The definitive VR shooter.' },
    { appid: 418650, title: 'Space Pirate Trainer',   desc: 'Defend your platform against waves of droids in deep space.' },
    { appid: 611670, title: 'Pavlov VR',             desc: 'Competitive multiplayer FPS built for virtual reality.' },
    { appid: 916840, title: 'Pistol Whip',           desc: 'Cinematic action-rhythm in a bullet-hell VR world.' },
  ];

  // Recent = first 6 (simulating recency-ordered), Library = rest
  const recent  = GAMES.slice(0, 6);
  const library = GAMES.slice(6);

  // Art URLs
  const heroImg   = id => `https://cdn.akamai.steamstatic.com/steam/apps/${id}/library_hero.jpg`;
  const capsImg   = id => `https://cdn.akamai.steamstatic.com/steam/apps/${id}/capsule_616x353.jpg`;
  const headerImg = id => `https://cdn.akamai.steamstatic.com/steam/apps/${id}/header.jpg`;

  // DOM refs
  const heroArt   = document.getElementById('heroArt');
  const heroTitle  = document.getElementById('heroTitle');
  const heroDesc   = document.getElementById('heroDesc');
  const heroLabel  = document.getElementById('heroLabel');
  const btnLaunch  = document.getElementById('btnLaunch');
  const recentRow  = document.getElementById('recentRow');
  const libraryRow = document.getElementById('libraryRow');

  let currentAppId = null;
  let activeCard   = null;

  // ── Set hero ──
  function setHero(game, isResume) {
    if (game.appid === currentAppId) return;
    currentAppId = game.appid;

    // hero art with fallback
    const img = new Image();
    img.onload = () => { heroArt.style.backgroundImage = `url(${heroImg(game.appid)})`; };
    img.onerror = () => { heroArt.style.backgroundImage = `url(${capsImg(game.appid)})`; };
    img.src = heroImg(game.appid);

    heroLabel.textContent = isResume ? 'Continue Playing' : 'Ready to Launch';
    heroTitle.textContent = game.title;
    heroTitle.classList.remove('fade-swap');
    void heroTitle.offsetWidth; // reflow
    heroTitle.classList.add('fade-swap');
    heroDesc.textContent = game.desc;

    // highlight active card
    if (activeCard) activeCard.classList.remove('active-card');
    const card = document.querySelector(`.card[data-appid="${game.appid}"]`);
    if (card) { card.classList.add('active-card'); activeCard = card; }
  }

  // ── Build card ──
  function makeCard(game) {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.appid = game.appid;
    el.innerHTML = `
      <div class="card-img" style="background-image:url(${headerImg(game.appid)})"></div>
      <div class="card-title">${game.title}</div>
    `;
    el.addEventListener('click', () => setHero(game, false));
    return el;
  }

  // ── Populate rows ──
  recent.forEach(g => recentRow.appendChild(makeCard(g)));
  library.forEach(g => libraryRow.appendChild(makeCard(g)));

  // ── Launch action ──
  btnLaunch.addEventListener('click', () => {
    btnLaunch.textContent = 'Launching...';
    btnLaunch.style.filter = 'brightness(0.8)';
    setTimeout(() => { btnLaunch.textContent = 'Launch'; btnLaunch.style.filter = ''; }, 1500);
  });

  // ── Init: most recent game as hero ──
  setHero(GAMES[0], true);
</script>
</body>
</html>
